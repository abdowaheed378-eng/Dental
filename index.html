<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sukon</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#14213d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sukon">

<style>
:root{--navy:#14213d;--navy-2:#22345c;--ink:#14213d;--paper:#f4f6fa;--card:#ffffff;--line:#d9dfeb;--edge:#c5cde0;--danger:#a4262c;--muted:#5b6780;--soft:#e8edf6}
*{box-sizing:border-box}
body{margin:0;padding-bottom:calc(78px + env(safe-area-inset-bottom,0px));background:var(--paper);color:var(--ink);font-family:"Cairo","Segoe UI",Tahoma,sans-serif;font-size:16px;line-height:1.6}
main{max-width:640px;margin:0 auto;padding:16px;position:relative;z-index:1}
h1{font-size:1.4rem;margin:0}
h2{font-size:1.05rem;margin:20px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
p{margin:0 0 12px;color:var(--muted)}
.brand{font-family:Georgia,"Times New Roman",serif;font-size:2.2rem;font-weight:700;text-align:center;letter-spacing:.08em;margin:28px 0 16px;color:var(--navy)}
.card{background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:10px}
.card h1{margin-bottom:8px}
label{display:block;margin-bottom:10px;font-weight:600;font-size:.95rem}
input,textarea,select{width:100%;padding:10px 12px;margin-top:4px;border:1px solid var(--edge);border-radius:6px;font:inherit;background:#fff;color:var(--ink)}
input:focus,textarea:focus,select:focus,button:focus-visible,summary:focus-visible,.btn:focus-visible{outline:2px solid var(--navy-2);outline-offset:1px}
button{font:inherit;font-weight:600;padding:10px 18px;border:1px solid var(--navy);border-radius:6px;background:var(--navy);color:#fff;cursor:pointer}
button.ghost{background:#fff;color:var(--navy);border:1px solid var(--edge)}
button.danger{background:transparent;color:var(--danger);border-color:transparent}
button.small{padding:4px 10px;font-size:.85rem}
button.link{background:none;color:var(--navy);border:0;padding:0;font-size:1.05rem;text-align:right}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;background:var(--navy);color:#fff;padding:12px 16px;border-radius:8px}
.bar h1{font-family:Georgia,"Times New Roman",serif;letter-spacing:.08em;color:#fff;font-size:1.5rem}
.bar button.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.45)}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.name{font-weight:700}
.meta{color:var(--muted);font-size:.9rem}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{display:inline-block;padding:0 8px;border-radius:4px;border:1px solid var(--edge);font-size:.8rem;color:var(--muted);background:var(--soft)}
summary{cursor:pointer;font-weight:700;color:var(--navy)}
.err{color:var(--danger);min-height:1.4em;margin:0 0 8px}
.ltr{direction:ltr;text-align:left}
[hidden]{display:none !important}
.sum{display:flex;justify-content:space-between;gap:8px;text-align:center}
.sum>div{flex:1}
.sum .name{font-size:1.1rem}
.due{color:var(--danger)}
.btn{display:inline-block;font:inherit;font-weight:600;padding:4px 10px;border-radius:6px;border:1px solid var(--edge);color:var(--navy);text-decoration:none;font-size:.85rem;background:#fff}
.remind{width:100%;text-align:right;background:var(--soft);color:var(--navy);border:1px solid var(--navy);padding:10px 14px;border-radius:8px;margin-bottom:10px;font-weight:700}
.bottomnav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
.bottomnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:transparent;color:var(--muted);border:0;border-top:3px solid transparent;border-radius:0;padding:8px 0 10px;font-size:.8rem}
.bottomnav button.on{color:var(--navy);border-top-color:var(--navy)}
details.card{padding:0;overflow:hidden}
details.card>summary{list-style:none;display:block;text-align:center;background:var(--navy);color:#fff;padding:12px 14px}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::before{content:"+  ";font-weight:700}
details.card[open]>summary::before{content:"\2212  "}
details.card>div{padding:14px !important;margin-top:0 !important}
.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
body::before{content:"";position:fixed;left:0;right:0;top:0;bottom:0;background:url(watermark.png) center 40%/min(92vw,520px) no-repeat;opacity:.10;pointer-events:none;z-index:0}
</style>
</head>
<body>
<main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const $ = s => document.querySelector(s);
const app = $('#app');
let sb = null;

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = d => new Date(d).toLocaleString('ar-EG', { dateStyle: 'medium', timeStyle: 'short' });
const money = n => Number(n || 0).toLocaleString('ar-EG') + ' ج.م';
const dateOnly = d => new Date(d + 'T00:00:00').toLocaleDateString('ar-EG', { dateStyle: 'medium' });
const today = () => new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const CASE_ST = { open: 'مفتوحة', closed: 'مكتملة' };
const APPT_ST = { scheduled: 'محجوز', done: 'تم', cancelled: 'ملغي' };

function getCfg() {
  try { return JSON.parse(localStorage.getItem('cfg') || 'null'); } catch (e) { return null; }
}

function shell(active, inner) {
  app.innerHTML = `
    <div class="bar"><h1>Sukon</h1><button class="ghost" id="logout">خروج</button></div>
    <div id="todayBar"></div>${inner}
    <nav class="bottomnav">
      <button id="tp" class="${active === 'p' ? 'on' : ''}">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 19c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/><circle cx="17" cy="9" r="2.4"/><path d="M16 14.2c2.8 0 5 1.8 5 4.8"/></svg>
        <span>المرضى</span></button>
      <button id="ta" class="${active === 'a' ? 'on' : ''}">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
        <span>المواعيد</span></button>
    </nav>`;
  $('#logout').onclick = async () => { await sb.auth.signOut(); viewLogin(); };
  $('#tp').onclick = viewPatients;
  $('#ta').onclick = viewAppointments;
  if (active !== 'a') loadTodayBar();
}

/* ---------- التذكيرات ---------- */
function waNumber(ph) {
  let d = String(ph || '').replace(/[٠-٩]/g, c => '٠١٢٣٤٥٦٧٨٩'.indexOf(c)).replace(/\D/g, '');
  if (!d) return '';
  if (d.startsWith('00')) d = d.slice(2);
  else if (d.startsWith('0')) d = '20' + d.slice(1);
  return d;
}

function waLink(p, iso) {
  const num = waNumber(p && p.phone);
  if (!num) return '';
  const d = new Date(iso);
  const day = d.toLocaleDateString('ar-EG', { weekday: 'long', day: 'numeric', month: 'long' });
  const time = d.toLocaleTimeString('ar-EG', { hour: 'numeric', minute: '2-digit' });
  const msg = 'السلام عليكم ' + p.name + '، تذكير بموعدك في العيادة يوم ' + day + ' الساعة ' + time + '. نرجو تأكيد الحضور.';
  return 'https://wa.me/' + num + '?text=' + encodeURIComponent(msg);
}

function calLink(name, iso, notes) {
  const s = new Date(iso), e = new Date(s.getTime() + 30 * 60000);
  const f = d => d.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent('موعد: ' + name) +
    '&dates=' + f(s) + '/' + f(e) + (notes ? '&details=' + encodeURIComponent(notes) : '');
}

function dayTag(iso) {
  const d = new Date(iso); d.setHours(0, 0, 0, 0);
  const t = new Date(); t.setHours(0, 0, 0, 0);
  const diff = Math.round((d - t) / 86400000);
  return diff === 0 ? 'اليوم' : diff === 1 ? 'غداً' : '';
}

async function loadTodayBar() {
  const box = $('#todayBar');
  if (!box) return;
  const start = new Date(); start.setHours(0, 0, 0, 0);
  const mid = new Date(start.getTime() + 86400000);
  const end = new Date(start.getTime() + 2 * 86400000);
  const { data, error } = await sb.from('appointments').select('starts_at')
    .eq('status', 'scheduled')
    .gte('starts_at', start.toISOString()).lt('starts_at', end.toISOString());
  const bar = $('#todayBar');
  if (!bar || error || !data || !data.length) return;
  const t = data.filter(a => new Date(a.starts_at) < mid).length;
  const m = data.length - t;
  const parts = [];
  if (t) parts.push('اليوم: ' + t);
  if (m) parts.push('غداً: ' + m);
  bar.innerHTML = '<button class="remind" id="goAppts">مواعيد قادمة — ' + parts.join(' | ') + '</button>';
  $('#goAppts').onclick = viewAppointments;
}

/* ---------- الإعداد وتسجيل الدخول ---------- */
function viewSetup() {
  app.innerHTML = `
    <div class="brand">Sukon</div>
    <section class="card">
      <h1>ربط التطبيق بقاعدة البيانات</h1>
      <p>الصق بيانات مشروعك من Supabase. تُحفظ على هذا الجهاز فقط.</p>
      <label>رابط المشروع (Project URL)
        <input id="url" class="ltr" placeholder="https://xxxx.supabase.co" autocapitalize="off"></label>
      <label>المفتاح العام (anon / publishable key)
        <input id="key" class="ltr" autocapitalize="off"></label>
      <p class="err" id="err"></p>
      <button id="save">حفظ</button>
    </section>`;
  $('#save').onclick = () => {
    const url = $('#url').value.trim();
    const key = $('#key').value.trim();
    if (!url.startsWith('https://') || !key) { $('#err').textContent = 'اكتب الرابط (يبدأ بـ https://) والمفتاح.'; return; }
    localStorage.setItem('cfg', JSON.stringify({ url, key }));
    start();
  };
}

function viewLogin() {
  app.innerHTML = `
    <div class="brand">Sukon</div>
    <section class="card">
      <h1>تسجيل الدخول</h1>
      <label>البريد الإلكتروني
        <input id="email" type="email" class="ltr" autocapitalize="off" autocomplete="username"></label>
      <label>كلمة السر
        <input id="pass" type="password" class="ltr" autocomplete="current-password"></label>
      <p class="err" id="err"></p>
      <button id="login">دخول</button>
      <button class="ghost" id="reset">تغيير بيانات الاتصال</button>
    </section>`;
  $('#login').onclick = async () => {
    $('#err').textContent = '';
    let res;
    try {
      res = await sb.auth.signInWithPassword({ email: $('#email').value.trim(), password: $('#pass').value });
    } catch (e) {
      $('#err').textContent = 'تعذر الاتصال بالخادم. افتح الملف من Chrome وتأكد من الإنترنت وبيانات الربط.';
      return;
    }
    const { error } = res;
    if (error) {
      const m = String(error.message || '');
      $('#err').textContent = /fetch|network/i.test(m)
        ? 'تعذر الاتصال بالخادم. افتح الملف من Chrome وتأكد من الإنترنت وبيانات الربط.'
        : 'البريد أو كلمة السر غير صحيحة.';
      return;
    }
    viewPatients();
  };
  $('#reset').onclick = () => { localStorage.removeItem('cfg'); viewSetup(); };
}

/* ---------- المرضى ---------- */
function viewPatients() {
  shell('p', `
    <details class="card" id="addBox">
      <summary>إضافة مريض</summary>
      <div style="margin-top:12px">
        <label>الاسم <input id="pname"></label>
        <label>التليفون <input id="pphone" type="tel" class="ltr"></label>
        <label>تاريخ الميلاد <input id="pbirth" type="date" class="ltr"></label>
        <label>ملاحظات <textarea id="pnotes" rows="2"></textarea></label>
        <p class="err" id="err"></p>
        <div class="actions" style="margin-top:0">
          <button id="add">حفظ المريض</button>
          <button class="ghost" id="addAppt" hidden>حفظ وحجز موعد</button>
        </div>
      </div>
    </details>
    <label>بحث بالاسم <input id="search" type="search"></label>
    <div id="list"></div>`);
  $('#search').oninput = e => loadPatients(e.target.value.trim());
  $('#add').onclick = () => addPatient(false);
  $('#addAppt').onclick = () => addPatient(true);
  $('#pname').oninput = () => { $('#addAppt').hidden = !$('#pname').value.trim(); };
  loadPatients();
}

async function addPatient(openAppt) {
  const name = $('#pname').value.trim();
  if (!name) { $('#err').textContent = 'اكتب اسم المريض.'; return; }
  const { data, error } = await sb.from('patients').insert({
    name,
    phone: $('#pphone').value.trim() || null,
    birth_date: $('#pbirth').value || null,
    notes: $('#pnotes').value.trim() || null
  }).select().single();
  if (error) { $('#err').textContent = 'تعذر الحفظ: ' + error.message; return; }
  if (openAppt && data) viewPatient(data.id, true);
  else viewPatients();
}

async function loadPatients(q = '') {
  let query = sb.from('patients').select('*').order('created_at', { ascending: false });
  if (q) query = query.ilike('name', '%' + q + '%');
  const { data, error } = await query;
  const list = $('#list');
  if (error) { list.innerHTML = `<p class="err">تعذر تحميل المرضى: ${esc(error.message)}</p>`; return; }
  if (!data.length) { list.innerHTML = '<p>لا يوجد مرضى بعد. اضغط "إضافة مريض" لتسجيل أول مريض.</p>'; return; }
  list.innerHTML = data.map(p => `
    <div class="card">
      <div class="row">
        <div>
          <button class="link" data-open="${esc(p.id)}">${esc(p.name)}</button>
          <div class="meta">${esc(p.phone || 'بدون تليفون')}${p.birth_date ? ' — ' + esc(p.birth_date) : ''}</div>
          ${p.notes ? `<div class="meta">${esc(p.notes)}</div>` : ''}
        </div>
        <button class="danger small" data-del="${esc(p.id)}">حذف</button>
      </div>
    </div>`).join('');
  list.querySelectorAll('[data-open]').forEach(b => b.onclick = () => viewPatient(b.dataset.open));
  list.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    if (!confirm('حذف المريض وكل حالاته ومواعيده؟')) return;
    await sb.from('patients').delete().eq('id', b.dataset.del);
    loadPatients($('#search').value.trim());
  });
}

/* ---------- صفحة المريض: الحالات والمواعيد ---------- */
async function viewPatient(id, openAppt = false) {
  shell('p', '<p>جارٍ التحميل...</p>');
  const [pr, cr, ar, payr] = await Promise.all([
    sb.from('patients').select('*').eq('id', id).single(),
    sb.from('cases').select('*').eq('patient_id', id).order('created_at', { ascending: false }),
    sb.from('appointments').select('*').eq('patient_id', id).order('starts_at', { ascending: false }),
    sb.from('payments').select('*').eq('patient_id', id).order('paid_at', { ascending: false })
  ]);
  if (pr.error) { app.insertAdjacentHTML('beforeend', `<p class="err">${esc(pr.error.message)}</p>`); return; }
  const p = pr.data, cases = cr.data || [], appts = ar.data || [];
  const payments = payr.error ? [] : (payr.data || []);
  const payErr = payr.error ? 'لم يتم إنشاء جدول المدفوعات بعد. شغّل كود SQL الخاص بها في Supabase.' : '';
  const totalFee = cases.reduce((s, c) => s + Number(c.fee || 0), 0);
  const paidTotal = payments.reduce((s, x) => s + Number(x.amount || 0), 0);
  const rest = totalFee - paidTotal;
  const caseName = cid => { const c = cases.find(x => x.id === cid); return c ? (c.complaint || 'حالة') : ''; };

  shell('p', `
    <button class="ghost small" id="back">رجوع للمرضى</button>
    <div class="card" style="margin-top:10px">
      <div class="name">${esc(p.name)}</div>
      <div class="meta">${esc(p.phone || 'بدون تليفون')}${p.birth_date ? ' — ' + esc(p.birth_date) : ''}</div>
      ${p.notes ? `<div class="meta">${esc(p.notes)}</div>` : ''}
    </div>

    <div class="card sum">
      <div><div class="meta">الإجمالي</div><div class="name">${money(totalFee)}</div></div>
      <div><div class="meta">المدفوع</div><div class="name">${money(paidTotal)}</div></div>
      <div><div class="meta">المتبقي</div><div class="name ${rest > 0 ? 'due' : ''}">${money(rest)}</div></div>
    </div>

    <h2>الحالات</h2>
    <details class="card">
      <summary>إضافة حالة</summary>
      <div style="margin-top:12px">
        <label>الشكوى <input id="cc"></label>
        <label>التشخيص <input id="cd"></label>
        <label>العلاج <textarea id="ct" rows="2"></textarea></label>
        <label>التكلفة (ج.م) <input id="cf" type="number" inputmode="decimal" min="0" class="ltr"></label>
        <p class="err" id="cerr"></p>
        <button id="cadd">حفظ الحالة</button>
      </div>
    </details>
    ${cases.length ? cases.map(c => `
      <div class="card">
        <div class="row">
          <div class="name">${esc(c.complaint || 'بدون شكوى')}</div>
          <span class="tag">${esc(CASE_ST[c.status] || c.status)}</span>
        </div>
        ${c.diagnosis ? `<div class="meta">التشخيص: ${esc(c.diagnosis)}</div>` : ''}
        ${c.treatment ? `<div class="meta">العلاج: ${esc(c.treatment)}</div>` : ''}
        ${Number(c.fee) > 0 ? `<div class="meta">التكلفة: ${esc(money(c.fee))} — المدفوع: ${esc(money(payments.filter(x => x.case_id === c.id).reduce((s, x) => s + Number(x.amount || 0), 0)))}</div>` : ''}
        <div class="actions">
          <button class="ghost small" data-ctoggle="${esc(c.id)}" data-st="${esc(c.status)}">${c.status === 'open' ? 'تحديد كمكتملة' : 'إعادة فتح'}</button>
          <button class="danger small" data-cdel="${esc(c.id)}">حذف</button>
        </div>
      </div>`).join('') : '<p>لا توجد حالات بعد.</p>'}

    <h2>المدفوعات</h2>
    ${payErr ? `<p class="err">${esc(payErr)}</p>` : `
    <details class="card">
      <summary>تسجيل دفعة</summary>
      <div style="margin-top:12px">
        <label>المبلغ (ج.م) <input id="pamt" type="number" inputmode="decimal" min="0" class="ltr"></label>
        <label>التاريخ <input id="pdate" type="date" class="ltr" value="${today()}"></label>
        <label>الحالة المرتبطة (اختياري)
          <select id="pcase"><option value="">بدون</option>
          ${cases.map(c => `<option value="${esc(c.id)}">${esc(c.complaint || 'حالة')}</option>`).join('')}</select></label>
        <label>ملاحظات <input id="pnote"></label>
        <p class="err" id="perr"></p>
        <button id="padd">حفظ الدفعة</button>
      </div>
    </details>
    ${payments.length ? payments.map(pm => `
      <div class="card">
        <div class="row">
          <div>
            <div class="name">${esc(money(pm.amount))}</div>
            <div class="meta">${esc(dateOnly(pm.paid_at))}${pm.case_id ? ' — ' + esc(caseName(pm.case_id)) : ''}</div>
            ${pm.notes ? `<div class="meta">${esc(pm.notes)}</div>` : ''}
          </div>
          <button class="danger small" data-pdel="${esc(pm.id)}">حذف</button>
        </div>
      </div>`).join('') : '<p>لا توجد دفعات بعد.</p>'}`}

    <h2>المواعيد</h2>
    <details class="card">
      <summary>إضافة موعد</summary>
      <div style="margin-top:12px">
        <label>التاريخ والوقت <input id="adt" type="datetime-local" class="ltr"></label>
        <label>الحالة المرتبطة (اختياري)
          <select id="acase"><option value="">بدون</option>
          ${cases.map(c => `<option value="${esc(c.id)}">${esc(c.complaint || 'حالة')}</option>`).join('')}</select></label>
        <label>ملاحظات <input id="anotes"></label>
        <p class="err" id="aerr"></p>
        <button id="aadd">حفظ الموعد</button>
      </div>
    </details>
    ${appts.length ? appts.map(a => apptCard(a, caseName(a.case_id), p)).join('') : '<p>لا توجد مواعيد بعد.</p>'}
  `);

  $('#back').onclick = viewPatients;

  $('#cadd').onclick = async () => {
    const complaint = $('#cc').value.trim();
    if (!complaint) { $('#cerr').textContent = 'اكتب الشكوى.'; return; }
    const { error } = await sb.from('cases').insert({
      patient_id: id, complaint,
      diagnosis: $('#cd').value.trim() || null,
      treatment: $('#ct').value.trim() || null,
      fee: Number($('#cf').value) || 0
    });
    if (error) { $('#cerr').textContent = 'تعذر الحفظ: ' + error.message; return; }
    viewPatient(id);
  };

  $('#aadd').onclick = async () => {
    const v = $('#adt').value;
    if (!v) { $('#aerr').textContent = 'اختر التاريخ والوقت.'; return; }
    const { error } = await sb.from('appointments').insert({
      patient_id: id,
      case_id: $('#acase').value || null,
      starts_at: new Date(v).toISOString(),
      notes: $('#anotes').value.trim() || null
    });
    if (error) { $('#aerr').textContent = 'تعذر الحفظ: ' + error.message; return; }
    viewPatient(id);
  };

  document.querySelectorAll('[data-ctoggle]').forEach(b => b.onclick = async () => {
    await sb.from('cases').update({ status: b.dataset.st === 'open' ? 'closed' : 'open' }).eq('id', b.dataset.ctoggle);
    viewPatient(id);
  });
  document.querySelectorAll('[data-cdel]').forEach(b => b.onclick = async () => {
    if (!confirm('حذف هذه الحالة؟')) return;
    await sb.from('cases').delete().eq('id', b.dataset.cdel);
    viewPatient(id);
  });
  if ($('#padd')) $('#padd').onclick = async () => {
    const amount = Number($('#pamt').value);
    if (!(amount > 0)) { $('#perr').textContent = 'اكتب مبلغاً أكبر من صفر.'; return; }
    const { error } = await sb.from('payments').insert({
      patient_id: id,
      case_id: $('#pcase').value || null,
      amount,
      paid_at: $('#pdate').value || today(),
      notes: $('#pnote').value.trim() || null
    });
    if (error) { $('#perr').textContent = 'تعذر الحفظ: ' + error.message; return; }
    viewPatient(id);
  };
  document.querySelectorAll('[data-pdel]').forEach(b => b.onclick = async () => {
    if (!confirm('حذف هذه الدفعة؟')) return;
    await sb.from('payments').delete().eq('id', b.dataset.pdel);
    viewPatient(id);
  });
  bindAppts(() => viewPatient(id));

  if (openAppt) {
    const box = $('#adt') && $('#adt').closest('details');
    if (box) { box.open = true; box.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
  }
}

/* ---------- المواعيد ---------- */
function apptCard(a, extra, patient) {
  const pt = patient || a.patients || null;
  const who = a.patients ? `<div class="name">${esc(a.patients.name)}</div>` : '';
  const dt = dayTag(a.starts_at);
  const sched = a.status === 'scheduled';
  const wa = sched && pt ? waLink(pt, a.starts_at) : '';
  const cal = sched && pt ? calLink(pt.name, a.starts_at, a.notes) : '';
  const id = esc(a.id);
  return `
    <div class="card">
      <div class="row">
        <div>
          ${who}
          <div class="${who ? 'meta' : 'name'}">${esc(fmt(a.starts_at))}${dt ? ' — ' + esc(dt) : ''}</div>
          ${extra ? `<div class="meta">${esc(extra)}</div>` : ''}
          ${a.notes ? `<div class="meta">${esc(a.notes)}</div>` : ''}
        </div>
        <span class="tag">${esc(APPT_ST[a.status] || a.status)}</span>
      </div>
      ${(wa || cal) ? `<div class="actions">
        ${wa ? `<a class="btn primary" href="${esc(wa)}" target="_blank" rel="noopener">تذكير واتساب</a>` : ''}
        ${cal ? `<a class="btn" href="${esc(cal)}" target="_blank" rel="noopener">أضف للتقويم</a>` : ''}
      </div>` : ''}
      <div class="actions">
        ${sched
          ? `<button class="small" data-ast="done" data-aid="${id}">تم</button>
             <button class="ghost small" data-ast="cancelled" data-aid="${id}">إلغاء</button>`
          : `<button class="ghost small" data-ast="scheduled" data-aid="${id}">إعادة حجز</button>`}
        <button class="danger small" data-adel="${id}">حذف</button>
      </div>
    </div>`;
}

function bindAppts(reload) {
  document.querySelectorAll('[data-ast]').forEach(b => b.onclick = async () => {
    await sb.from('appointments').update({ status: b.dataset.ast }).eq('id', b.dataset.aid);
    reload();
  });
  document.querySelectorAll('[data-adel]').forEach(b => b.onclick = async () => {
    if (!confirm('حذف هذا الموعد؟')) return;
    await sb.from('appointments').delete().eq('id', b.dataset.adel);
    reload();
  });
}

async function viewAppointments() {
  shell('a', '<p id="loading">جارٍ التحميل...</p>');
  const from = new Date(); from.setHours(0, 0, 0, 0);
  const { data, error } = await sb.from('appointments')
    .select('*, patients(name, phone)')
    .gte('starts_at', from.toISOString())
    .order('starts_at', { ascending: true });
  const box = document.createElement('div');
  if (error) box.innerHTML = `<p class="err">تعذر تحميل المواعيد: ${esc(error.message)}</p>`;
  else if (!data.length) box.innerHTML = '<p>لا توجد مواعيد قادمة. أضف موعداً من صفحة المريض.</p>';
  else box.innerHTML = '<h2>المواعيد القادمة</h2>' + data.map(a => apptCard(a, '')).join('');
  const ld = $('#loading'); if (ld) ld.replaceWith(box);
  bindAppts(viewAppointments);
}

async function start() {
  const c = getCfg();
  if (!c) { viewSetup(); return; }
  sb = supabase.createClient(c.url, c.key);
  const { data: { session } } = await sb.auth.getSession();
  session ? viewPatients() : viewLogin();
}
start();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
